<!DOCTYPE html>
<html>
<head>
  <title>던파 공대 메이커</title>
  <style>
    body {
      background: #fff0f5;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #ff69b4;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 600px;
      margin: 20px auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input, select {
      padding: 8px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 10px;
      background: #ffb6c1;
      cursor: pointer;
    }

    ul {
      padding: 0;
    }

    li {
      background: #f9f9f9;
      margin: 5px;
      padding: 8px;
      border-radius: 10px;
      list-style: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }

    th {
      background: #ffe4ec;
    }
  </style>
</head>

<body>

<h1>🎮 던파 공대 메이커</h1>

<div class="container">
  <h3>캐릭터 추가</h3>

  <input type="text" id="name" placeholder="닉네임">
  
  <select id="type">
    <option value="딜러">딜러</option>
    <option value="버퍼">버퍼</option>
  </select>

  <input type="number" id="power" placeholder="딜/버프력">
  <input type="number" id="fame" placeholder="명성">

  <button onclick="addChar()">추가</button>
</div>

<div class="container">
  <h3>📋 캐릭터 DB</h3>
  <ul id="list"></ul>
</div>

<div class="container">
  <button onclick="makeParty()">🎯 공대 자동 생성</button>
  <div id="tableArea"></div>
</div>

<script>
let chars = [];

/*************** 캐릭터 추가 ***************/
function addChar() {
  const name = document.getElementById("name").value;
  const type = document.getElementById("type").value;
  const power = parseInt(document.getElementById("power").value);
  const fame = parseInt(document.getElementById("fame").value);

  if (!name || !power || !fame) return;

  chars.push({ name, type, power, fame });
  render();
}

/*************** 리스트 렌더 ***************/
function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  chars.forEach((c, i) => {
    list.innerHTML += `
      <li>
        ${c.name} (${c.type}) - ${c.power} / ${c.fame}
        <button onclick="removeChar(${i})">❌</button>
      </li>
    `;
  });
}

function removeChar(i) {
  chars.splice(i, 1);
  render();
}

/*************** 공대 생성 ***************/
function makeParty() {
  const dealers = chars.filter(c => c.type === "딜러").sort((a,b)=>b.power-a.power);
  const buffers = chars.filter(c => c.type === "버퍼").sort((a,b)=>b.power-a.power);

  let parties = [];
  let dIndex = 0;
  let bIndex = 0;

  while (dIndex + 2 < dealers.length && bIndex < buffers.length) {
    let party = [];

    party.push(buffers[bIndex++]);
    party.push(dealers[dIndex++]);
    party.push(dealers[dIndex++]);
    party.push(dealers[dIndex++]);

    parties.push(party);
  }

  renderParty(parties);
}

/*************** 표 출력 ***************/
function renderParty(parties) {
  const area = document.getElementById("tableArea");
  area.innerHTML = "";

  let html = `<table>`;

  parties.forEach((p, i) => {
    html += `<tr><th colspan="4">${i+1}파티</th></tr>`;
    html += `<tr>
      <th>닉네임</th>
      <th>역할</th>
      <th>딜/버프</th>
      <th>명성</th>
    </tr>`;

    p.forEach(c => {
      html += `<tr>
        <td>${c.name}</td>
        <td>${c.type}</td>
        <td>${c.power}</td>
        <td>${c.fame}</td>
      </tr>`;
    });
  });

  html += `</table>`;
  area.innerHTML = html;
}
</script>

</body>
</html>
