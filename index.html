<!DOCTYPE html>
<html>
<head>
  <title>던파 공대 메이커</title>
  <style>
    body {
      background: #fff0f5;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 20px;
      width: 600px;
      margin: 20px auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    textarea {
      width: 90%;
      height: 100px;
      border-radius: 10px;
      padding: 10px;
    }

    input {
      padding: 8px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: #ffb6c1;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    td, th {
      border: 1px solid #ddd;
      padding: 8px;
    }

    th {
      background: #ffe4ec;
    }
  </style>
</head>

<body>

<h1>🎮 던파 공대 메이커</h1>

<div class="container">
  <h3>모험단 입력</h3>
  <input type="text" id="adven" placeholder="모험단 이름">
  
  <h3>닉네임 리스트 (줄바꿈)</h3>
  <textarea id="names"></textarea>

  <br><br>
  <button onclick="loadData()">🔥 던담 불러오기</button>
</div>

<div class="container">
  <h3>📊 결과</h3>
  <div id="result"></div>
</div>

<script>
async function fetchDundam(advenName) {
  const url = "https://dundam.xyz/dat/searchData.jsp?server=adven&name=" + encodeURIComponent(advenName);

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}"
    });

    const text = await res.text();
    const s = text.indexOf("{");
    const e = text.lastIndexOf("}");

    if (s !== -1) {
      return JSON.parse(text.substring(s, e + 1)).characters;
    }
  } catch (e) {
    alert("❌ 크롤링 실패 (CORS 가능성 높음)");
  }

  return [];
}

function buildMap(chars) {
  const map = {};

  chars.forEach(c => {
    const key = c.name.toLowerCase();

    let score = "0";

    const isMuri = String(c.setname).includes("무리");
    const isEnchant = String(c.job).includes("인챈트리스");

    if (isMuri && c.ozma) {
      const eok = (c.ozma.match(/(\d+)\s*억/) || [0, 0])[1];
      const man = (c.ozma.match(/(\d+)\s*만/) || [0, 0])[1];
      const raw = (Number(eok)*100000000)+(Number(man)*10000);
      score = Math.floor((raw/1.08*1.24)/100000000) + "억";

    } else if (isEnchant && c.buffScore4) {
      score = Math.floor(Number(c.buffScore4.replace(/,/g,''))/10000)+"만";

    } else if (c.buffScore && c.buffScore !== "0") {
      score = Math.floor(Number(c.buffScore.replace(/,/g,''))/10000)+"만";

    } else if (c.ozma) {
      score = (c.ozma.match(/(\d+)\s*억/) || ["","0"])[1] + "억";
    }

    map[key] = {
      score: score,
      fame: c.fame || "0"
    };
  });

  return map;
}

async function loadData() {
  const adven = document.getElementById("adven").value;
  const namesText = document.getElementById("names").value;

  const names = namesText.split("\n").map(n => n.trim().toLowerCase());

  const data = await fetchDundam(adven);
  const map = buildMap(data);

  let html = "<table>";
  html += "<tr><th>닉네임</th><th>딜/버프</th><th>명성</th></tr>";

  names.forEach(name => {
    if (!name) return;

    if (map[name]) {
      html += `<tr>
        <td>${name}</td>
        <td>${map[name].score}</td>
        <td>${map[name].fame}</td>
      </tr>`;
    } else {
      html += `<tr>
        <td>${name}</td>
        <td>없음</td>
        <td>-</td>
      </tr>`;
    }
  });

  html += "</table>";

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
