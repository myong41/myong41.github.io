<!DOCTYPE html>
<html>
<head>
  <title>귀여운 사이트</title>
  <style>
    body {
      background: #fff0f5;
      color: #333;
      text-align: center;
      font-family: "Arial", sans-serif;
      margin-top: 100px;
    }

    h1 {
      font-size: 48px;
      color: #ff69b4;
    }

    p {
      font-size: 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background: #ffb6c1;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #ff69b4;
      color: white;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 300px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🐰 안녕!</h1>
  <p>내 귀여운 웹사이트에 온 걸 환영해 💖</p>

  <button onclick="alert('반가워! 😊')">눌러줘!</button>
</div>

</body>
</html>
