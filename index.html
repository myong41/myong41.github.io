<!DOCTYPE html>
<html>
<head>
  <title>던파 공대 메이커</title>
  <style>
    body {
      background: #fff0f5;
      font-family: Arial;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: #ff69b4;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 400px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      width: 70%;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #ffb6c1;
      cursor: pointer;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #f9f9f9;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🎮 던파 공대 메이커</h1>

<div class="container">
  <h3>캐릭터 DB</h3>

  <input type="text" id="charName" placeholder="캐릭터 이름 입력">
  <button onclick="addCharacter()">추가</button>

  <ul id="charList"></ul>
</div>

<script>
  let characters = [];

  function addCharacter() {
    const input = document.getElementById("charName");
    const name = input.value.trim();

    if (name === "") return;

    characters.push(name);
    input.value = "";
    renderList();
  }

  function renderList() {
    const list = document.getElementById("charList");
    list.innerHTML = "";

    characters.forEach((char, index) => {
      const li = document.createElement("li");
      li.innerHTML = char + " <button onclick='removeChar(" + index + ")'>❌</button>";
      list.appendChild(li);
    });
  }

  function removeChar(index) {
    characters.splice(index, 1);
    renderList();
  }
</script>

</body>
</html>
